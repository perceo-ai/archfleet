name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the Docker image after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: archfleet
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web checks
        run: |
          set -euo pipefail
          npm run lint
          npm run test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run VM tooling checks
        run: |
          set -euo pipefail
          python -m unittest discover -s virt/agent-runner
          python -m unittest virt/test_clone_domain_xml.py
          bash -n deploy/*.sh virt/*.sh virt/ui-tars/*.sh

      - name: Validate compose files
        env:
          GUACAMOLE_ADMIN_PASSWORD: ci-guacamole-password
        run: |
          set -euo pipefail
          docker compose -f deploy/home-server.compose.yml config >/dev/null
          docker compose -f deploy/home-server.compose.yml -f deploy/guacamole.compose.yml config >/dev/null

  publish:
    name: Build and publish image
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'push' || inputs.publish_image
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=archfleet
          cache-to: type=gha,mode=max,scope=archfleet
