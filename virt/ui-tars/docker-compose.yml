# UI-TARS grounding server as a container — run locally (GPU) or on a cloud GPU
# host for scaling. Exposes an OpenAI-compatible endpoint on :8080.
#
#   UI_TARS_MODEL=ByteDance-Seed/UI-TARS-1.5-7B HF_TOKEN=... docker compose up -d
#
# Point the guest runner at it:
#   CUF_GROUNDING_BASE_URL=http://<host>:8080/v1
#
# For cloud scaling, deploy this image behind a load balancer / autoscaler and
# set CUF_GROUNDING_BASE_URL to the fronting URL.
services:
  ui-tars:
    image: vllm/vllm-openai:latest
    ports:
      - "8080:8080"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - "--model=${UI_TARS_MODEL:-ByteDance-Seed/UI-TARS-1.5-7B}"
      - "--served-model-name=${SERVED_NAME:-ui-tars-1.5-7b}"
      - "--host=0.0.0.0"
      - "--port=8080"
      - "--gpu-memory-utilization=${GPU_MEM_FRAC:-0.9}"
      - "--limit-mm-per-prompt"
      - "image=5"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
